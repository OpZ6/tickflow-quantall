# Tushare Pro 数据源插件
# 通过 tushare SDK 拉 A 股日K/除权/指数/财务/资金流,归一化到内部 schema。
# mirror 优先、原 Tushare 备用;开发模式: uv sync --extra tushare

name: tushare
display_name: "Tushare-compatible（mirror 优先）"
runtime: python
entry: app.plugins.tushare.provider:TushareProvider
check: app.plugins.tushare.bridge:availability
datasets: [daily, adj_factor, index, financial, moneyflow]
description: "Tushare-compatible A 股日K/除权/指数/财务/资金流。支持 mirror 优先、原 Tushare 备用。用于 quantall 能力迁移,替代 Quants ETL。"
install_hint: "uv sync --extra tushare;在环境变量中设置 TUSHARE_MIRROR_TOKEN + TUSHARE_MIRROR_API_URL，或设置 TUSHARE_TOKEN"
